services:
  - type: web
    name: bench-atlas
    runtime: python
    plan: free
    autoDeploy: true
    healthCheckPath: /api/config
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: bench-atlas-db
          property: connectionString
databases:
  - name: bench-atlas-db
    plan: free
